[[bin]]
path = "src/main.rs"
name = "colrskeww"
proc-macro = false
required-features = []

[package]
name = "colrskeww"
edition = "2024"
version = "0.0.1"

[dependencies]
image = "0.25.6"
imageproc = "0.25.0"
tracing-subscriber = "0.3.19"

[dependencies.poem]
version = "3.1.11"
features = ["multipart"]

[dependencies.tokio]
version = "1.45.1"
features = ["rt-multi-thread", "macros"]
